name: Publish backend container to Amazon ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-backend-ecr
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish API image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "622519216316"
      ECR_REPOSITORY: pet-api-oracle

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          chmod +x docker-entrypoint.sh
          sh -n docker-entrypoint.sh
          test_dir="$(mktemp -d)"
          mkdir -p "$test_dir/input" "$test_dir/bin" "$test_dir/extracted"
          printf 'wallet-test\n' > "$test_dir/input/tnsnames.ora"
          (cd "$test_dir/input" && zip -q "$test_dir/wallet.zip" tnsnames.ora)
          cat > "$test_dir/bin/java" <<'EOF'
          #!/bin/sh
          test -s "$TNS_ADMIN/tnsnames.ora"
          test -z "${ORACLE_WALLET_BASE64:-}"
          EOF
          chmod +x "$test_dir/bin/java"
          PATH="$test_dir/bin:$PATH" \
            TNS_ADMIN="$test_dir/extracted" \
            ORACLE_WALLET_BASE64="$(base64 --wrap=0 "$test_dir/wallet.zip")" \
            ./docker-entrypoint.sh
          ./mvnw -B test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Academy account and ECR repository
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::The configured AWS credentials point to account $account_id, not $AWS_ACCOUNT_ID."
            exit 1
          fi

          if ! repositories="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" 2>&1)"; then
            if [[ "$repositories" != *"RepositoryNotFoundException"* ]]; then
              echo "$repositories"
              exit 1
            fi

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "$AWS_REGION"
          else
            echo "$repositories"
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
