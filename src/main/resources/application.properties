spring.application.name=pet-api

# Oracle Cloud (Autonomous Database) con wallet. Los datos de conexion llegan por
# variables de entorno: no se escriben aqui ni se suben a git.
#   DB_URL      = jdbc:oracle:thin:@<servicio>_tp?TNS_ADMIN=<ruta a la carpeta del wallet>
#   DB_USERNAME = usuario de la base
#   DB_PASSWORD = contrasena del usuario
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

logging.level.root=INFO

# Origenes permitidos para el frontend Angular (ng serve usa el 4200).
# Varios se separan con coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=8080
